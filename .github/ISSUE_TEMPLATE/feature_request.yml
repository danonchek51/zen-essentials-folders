name: Feature request
description: An idea for the mod — describe the scenario, not just the button you want
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe **what you wanted to do** and why the current interface gets in the way.
        That makes it easier to understand what exactly needs to change.

  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: What you do step by step and what you want to get
      placeholder: |
        I have 30 pinned tabs from 8 different projects.
        I want to sort them into folders right from the Essentials grid,
        without opening each tab separately.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried
      description: How you solve the task today
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tiles and appearance
        - Folders and nesting
        - Drag and drop
        - Search
        - Mod settings
        - Compatibility with other mods
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives-detail
    attributes:
      label: Details
    validations:
      required: false
