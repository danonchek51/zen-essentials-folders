name: Bug report
description: Something in the mod does not work as expected — tell us what you expected and what you got
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill in the fields below — without the Zen and
        mod versions it is hard to make sense of the issue.

  - type: input
    id: zen-version
    attributes:
      label: Zen version
      placeholder: "1.24b"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: "1.11.0"
      description: The mod page in Zen → "Mod settings" → or the top of the `essentials-folders.uc.js` file
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How it was installed
      options:
        - Sine Store
        - Sine → Install from repo
        - Manually (copying the files)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you were doing and what you got
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the "Work" folder
        2. Drag the GitHub icon onto the "Study" tile
        3. The tab stayed in "Work"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs from the console (if any)
      description: "about:support → \"Browser Console\", the mod's messages are prefixed with [ZEF]"
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The mod is enabled in Zen Mods
          required: true
        - label: Zen was restarted after the changes
          required: false
